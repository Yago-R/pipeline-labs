name: "Lab 01 - Estrutura de Diretórios e Arquivos"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "18"

jobs:
  demonstrar-estrutura:
    name: "Demonstrar Estrutura Básica"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Mostrar estrutura .github/workflows
        run: |
          echo "=== ESTRUTURA DO DIRETÓRIO .github/workflows ==="
          ls -la .github/workflows/
          echo ""

          total=$(find .github/workflows -maxdepth 1 -type f \
            \( -name "*.yml" -o -name "*.yaml" \) | wc -l)

          echo "Total de workflows: $total"

      - name: Elementos do workflow
        run: |
          echo "=== ELEMENTOS DO WORKFLOW ==="
          echo "1. name: Nome do workflow (opcional)"
          echo "2. on: Eventos que iniciam a execução"
          echo "3. jobs: Trabalhos a executar"
          echo "4. runs-on: Ambiente de execução deste job"
          echo "5. steps: Etapas executadas em sequência neste job"

      - name: Variáveis e contextos
        env:
          REPOSITORIO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "=== VARIÁVEIS E CONTEXTOS ==="
          echo "Variável NODE_VERSION: $NODE_VERSION"
          echo "Repositório: $REPOSITORIO"
          echo "Branch: $BRANCH"
          echo "Usuário que iniciou a execução: $ACTOR"