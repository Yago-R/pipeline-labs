name: Contextos e Expressões

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  info-contexto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Exibir contexto GitHub
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Repositório: $GITHUB_REPOSITORY"
          echo "Ator que disparou: $GITHUB_ACTOR"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Branch de origem: $BRANCH_NAME"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "SHA da execução: $GITHUB_SHA"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            printf 'Mensagem do commit: %s\n' "$COMMIT_MESSAGE"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            printf 'Título do pull request: %s\n' "$PR_TITLE"
          else
            echo "Execução manual."
          fi

      - name: Exibir contexto Runner
        env:
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          RUNNER_DISPLAY_NAME: ${{ runner.name }}
        run: |
          echo "Sistema Operacional: $RUNNER_OS"
          echo "Arquitetura: $RUNNER_ARCHITECTURE"
          echo "Nome do runner: $RUNNER_DISPLAY_NAME"
          echo "Diretório temporário: $RUNNER_TEMP"
          echo "Diretório de ferramentas: $RUNNER_TOOL_CACHE"

      - name: Debug - Contexto GitHub selecionado
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF" \
            --arg branch "$BRANCH_NAME" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg sha "$GITHUB_SHA" \
            '{
              repository: $repository,
              actor: $actor,
              ref: $ref,
              branch: $branch,
              event_name: $event,
              sha: $sha
            }'

      - name: Debug - Contexto Runner completo
        env:
          RUNNER_CONTEXT: ${{ toJSON(runner) }}
        run: |
          printf '%s\n' "$RUNNER_CONTEXT"

  outputs-entre-steps:
    runs-on: ubuntu-latest

    outputs:
      versao: ${{ steps.gerar-versao.outputs.version }}
      ambiente: ${{ steps.definir-ambiente.outputs.env_name }}

    steps:
      - name: Gerar versão
        id: gerar-versao
        run: |
          VERSION="1.0.$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão gerada: $VERSION"

      - name: Definir ambiente baseado no evento e branch
        id: definir-ambiente
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ENV_NAME="development"
          elif [[ "$BRANCH_NAME" == "main" ]]; then
            ENV_NAME="production"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            ENV_NAME="staging"
          else
            ENV_NAME="development"
          fi

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "Ambiente definido: $ENV_NAME"

      - name: Usar outputs dos steps anteriores
        env:
          VERSION: ${{ steps.gerar-versao.outputs.version }}
          ENV_NAME: ${{ steps.definir-ambiente.outputs.env_name }}
        run: |
          echo "Usando versão: $VERSION"
          echo "Usando ambiente: $ENV_NAME"
          echo "Tag completa: $ENV_NAME-v$VERSION"

  expressoes-e-funcoes:
    runs-on: ubuntu-latest
    needs: outputs-entre-steps

    steps:
      - name: Verificar se é hotfix
        if: contains(env.BRANCH_NAME, 'hotfix')
        run: |
          echo "Este branch contém hotfix no nome!"

      - name: Ação apenas para feature branches
        if: startsWith(env.BRANCH_NAME, 'feature/')
        run: |
          echo "Branch de feature detectado: $BRANCH_NAME"

      - name: Verificar se o SHA termina com zero
        env:
          SHA_TERMINA_COM_ZERO: ${{ endsWith(github.sha, '0') }}
        run: |
          if [[ "$SHA_TERMINA_COM_ZERO" == "true" ]]; then
            echo "SHA termina com zero!"
          else
            echo "SHA não termina com zero: $GITHUB_SHA"
          fi

      - name: Criar mensagem formatada
        env:
          MESSAGE: ${{ format('Deploy da versão {0} para {1} por {2}', needs.outputs-entre-steps.outputs.versao, needs.outputs-entre-steps.outputs.ambiente, github.actor) }}
        run: |
          printf '%s\n' "$MESSAGE"

      - name: Simular deploy condicional
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/develop')
        env:
          VERSION: ${{ needs.outputs-entre-steps.outputs.versao }}
          ENV_NAME: ${{ needs.outputs-entre-steps.outputs.ambiente }}
        run: |
          echo "Simulando deploy automático..."
          echo "Versão: $VERSION"
          echo "Ambiente: $ENV_NAME"

  criar-artefato-dinamico:
    runs-on: ubuntu-latest
    needs: outputs-entre-steps

    steps:
      - name: Criar arquivo de build simulado
        env:
          VERSION: ${{ needs.outputs-entre-steps.outputs.versao }}
          ENV_NAME: ${{ needs.outputs-entre-steps.outputs.ambiente }}
        run: |
          mkdir -p build

          {
            echo "Build info"
            echo "Versão: $VERSION"
            echo "Ambiente: $ENV_NAME"
            echo "Branch: $BRANCH_NAME"
            echo "Commit da execução: $GITHUB_SHA"
            echo "Actor: $GITHUB_ACTOR"
          } > build/info.txt

          cat build/info.txt

      - name: Upload artefato com nome dinâmico
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('app-{0}-v{1}-{2}', needs.outputs-entre-steps.outputs.ambiente, needs.outputs-entre-steps.outputs.versao, github.sha) }}
          path: build/
          retention-days: 5
          if-no-files-found: error

  verificar-status:
    runs-on: ubuntu-latest

    needs:
      - info-contexto
      - outputs-entre-steps
      - expressoes-e-funcoes
      - criar-artefato-dinamico

    if: ${{ always() }}

    steps:
      - name: Verificar status dos jobs anteriores
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          echo "Status do job atual neste momento: $CURRENT_JOB_STATUS"
          echo "Resultados dos jobs anteriores:"

          printf '%s\n' "$NEEDS_CONTEXT" |
            jq -r 'to_entries[] | "\(.key): \(.value.result)"'

      - name: Notificar sucesso total
        if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: |
          echo "Todos os jobs executaram com SUCESSO!"

      - name: Notificar falha
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        run: |
          echo "Pelo menos um job FALHOU!"
          echo "Verifique os logs dos jobs anteriores."

      - name: Notificar cancelamento ou job ignorado
        if: ${{ always() && (contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: |
          echo "Pelo menos um job foi cancelado ou ignorado."